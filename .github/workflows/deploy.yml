name: Deploy Password-Protected Birthday Website

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build website
        run: npm run build

      - name: Prepare protected website
        env:
          STATICRYPT_PASSWORD: ${{ secrets.STATICRYPT_PASSWORD }}
        run: |
          if [ -z "$STATICRYPT_PASSWORD" ]; then
            echo "Missing STATICRYPT_PASSWORD repository secret."
            exit 1
          fi

          mkdir -p protected
          cp -a dist/. protected/

          npx --no-install staticrypt dist/index.html \
            --password "$STATICRYPT_PASSWORD" \
            --directory protected \
            --template-title "A Birthday Surprise ❤️" \
            --template-instructions "Enter the password to unlock your surprise."

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload protected website
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./protected

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
